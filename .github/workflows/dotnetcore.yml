name: .NET Core

on:
  push:
    branches: [main, vnext]
    paths:
      - src/**
      - global.json
      - Directory.Build.props
      - .github/workflows/dotnetcore.yml
  pull_request:
    branches: [main, vnext]
    paths:
      - src/**
      - global.json
      - Directory.Build.props
      - .github/workflows/dotnetcore.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Logic layer must not name UI frameworks
        run: if grep -rniE 'avalonia|sukiui|nxui' src/Migrondi.UI/Logic ; then echo "::error::UI framework reference found in src/Migrondi.UI/Logic"; exit 1; fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build Migrondi.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Migrondi.slnx --no-build --configuration Release --verbosity normal
