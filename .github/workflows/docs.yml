name: Docs

# Trigger this Action when documentation source or the documented code changes
on:
  push:
    branches:
      - vnext
    paths:
      - docs/**
      - src/**
      - Directory.Build.props
      - .config/dotnet-tools.json
      - .github/workflows/docs.yml

# We need some permissions to publish to Github Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build code
        run: dotnet build -c Release
      - name: Generate the documentation
        run: dotnet fsdocs build --properties Configuration=Release
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  # GitHub Actions recommends deploying in a separate job.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
